name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catalogue is valid
        run: python3 tools/depot.py validate
      - name: Site and feed are up to date
        run: python3 tools/depot.py build --check
